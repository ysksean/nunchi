<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>nunchi</title>
<style>
  html, body {
    margin: 0;
    background: transparent;
    overflow: hidden;
    user-select: none;
    font-family: -apple-system, "Apple SD Gothic Neo", sans-serif;
  }
  #stage {
    position: relative;
    width: 180px;
    height: 210px;
  }
  #bubble {
    position: absolute;
    top: 6px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255, 255, 255, 0.92);
    border-radius: 12px;
    padding: 4px 10px;
    font-size: 12px;
    color: #3d3929;
    white-space: nowrap;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
    opacity: 0;
    transition: opacity 0.25s;
  }
  #bubble.show { opacity: 1; }
  #petwrap {
    position: absolute;
    bottom: 10px;
    left: 50%;
    margin-left: -70px;
    width: 140px;
    height: 150px;
    transform-origin: 50% 100%;
    cursor: grab;
  }
  #pet { display: block; width: 100%; height: 100%; }

  /* touch physics: press-squish, release-jelly, hover-graze */
  #petwrap.held {
    cursor: grabbing;
    transform: scale(1.07, 0.88);
    transition: transform 0.1s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  #petwrap.boing { animation: jelly 0.65s cubic-bezier(0.36, 0.07, 0.19, 0.97); }

  .cheek { transform-box: fill-box; transform-origin: center; }
  #petwrap.held  .cheek { transform: scale(1.35, 0.7); transition: transform 0.1s; }
  #petwrap.boing .cheek { animation: cheekJiggle 0.7s cubic-bezier(0.36, 0.07, 0.19, 0.97); }
  #petwrap.graze .cheek { animation: cheekGraze 0.45s ease-out; }

  @keyframes jelly {
    0%   { transform: scale(1.07, 0.88); }
    30%  { transform: scale(0.94, 1.08); }
    55%  { transform: scale(1.04, 0.96); }
    75%  { transform: scale(0.98, 1.02); }
    100% { transform: scale(1, 1); }
  }
  @keyframes cheekJiggle {
    0%   { transform: translate(0, 2px) scale(1.35, 0.7); }
    20%  { transform: translate(-2.5px, -2px) scale(0.8, 1.3); }
    40%  { transform: translate(2px, 1.5px) scale(1.22, 0.82); }
    60%  { transform: translate(-1.5px, -1px) scale(0.9, 1.12); }
    80%  { transform: translate(1px, 0.5px) scale(1.06, 0.95); }
    100% { transform: none; }
  }
  @keyframes cheekGraze {
    0%   { transform: translateY(0) scale(1); }
    35%  { transform: translateY(1.5px) scale(1.15, 0.85); }
    70%  { transform: translateY(-1px) scale(0.93, 1.08); }
    100% { transform: none; }
  }
  #quit {
    position: absolute;
    top: 0;
    right: 6px;
    width: 20px;
    height: 20px;
    line-height: 20px;
    text-align: center;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.35);
    color: #fff;
    font-size: 12px;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.2s;
  }
  #stage:hover #quit { opacity: 1; }

  .heart {
    position: absolute;
    font-size: 16px;
    pointer-events: none;
    animation: floatHeart 0.9s ease-out forwards;
  }
  @keyframes floatHeart {
    0%   { opacity: 0; transform: translateY(0) scale(0.4); }
    30%  { opacity: 1; transform: translateY(-10px) scale(1); }
    100% { opacity: 0; transform: translateY(-34px) scale(0.9); }
  }

  .eye { transform-box: fill-box; transform-origin: center; animation: blink 4.5s infinite; }
  @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.08); } }

  /* Resting: after a spell of no activity we stop every looping animation so a
     transparent, always-on-top window stops repainting and the GPU can idle.
     Removing the animation returns transforms to their base pose (pet at rest). */
  body.resting #pet,
  body.resting .eye { animation: none !important; }
  @media (prefers-reduced-motion: reduce) {
    #pet, .eye { animation: none !important; }
  }

  #pet.anim-idle    { animation: breathe 3.2s ease-in-out infinite; }
  #pet.anim-bounce  { animation: bounce 0.55s ease-in-out infinite; }
  #pet.anim-shake   { animation: shake 0.35s linear infinite; }
  #pet.anim-droop   { animation: droop 3s ease-in-out infinite; }
  #pet.anim-pulse   { animation: pulse 0.5s ease-in-out infinite; }
  #pet.anim-sway    { animation: sway 1.6s ease-in-out infinite; }
  #pet.anim-sleep   { animation: breathe 5s ease-in-out infinite; }
  #pet.anim-tada    { animation: tada 0.85s ease-in-out infinite; }

  @keyframes breathe { 0%, 100% { transform: translateY(0) scaleY(1); } 50% { transform: translateY(-4px) scaleY(0.985); } }
  @keyframes bounce  { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
  @keyframes shake   { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px) rotate(-2deg); } 75% { transform: translateX(4px) rotate(2deg); } }
  @keyframes droop   { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(4px) scaleY(0.97); } }
  @keyframes pulse   { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  @keyframes sway    { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
  @keyframes tada {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    20%      { transform: translateY(-14px) rotate(-4deg); }
    40%      { transform: translateY(0) rotate(0deg); }
    60%      { transform: translateY(-14px) rotate(4deg); }
    80%      { transform: translateY(0) rotate(0deg); }
  }
</style>
</head>
<body>
<div id="stage">
  <div id="bubble"></div>
  <div id="quit" title="종료">×</div>
  <div id="petwrap">
    <svg id="pet" viewBox="0 0 140 150" xmlns="http://www.w3.org/2000/svg">
      <g id="body"></g>
      <g id="face"></g>
      <g id="extras"></g>
    </svg>
  </div>
</div>

<script>
  const DEFAULT_PALETTE = { faceInk: '#2d2418', cheek: '#F6C2BC' };

  // Faces are drawn on top of whatever body the skin provides, so they are
  // rebuilt whenever the palette changes.
  function buildFaces(palette) {
  const ink = palette.faceInk || DEFAULT_PALETTE.faceInk;
  const blush = palette.cheek || DEFAULT_PALETTE.cheek;

  const EYE = (cx, cy, r = 5.5) =>
    `<circle class="eye" cx="${cx}" cy="${cy}" r="${r}" fill="${ink}"/>`;
  const CHEEKS = (color = blush, op = 0.8) =>
    `<ellipse class="cheek" cx="34" cy="82" rx="9" ry="5.5" fill="${color}" opacity="${op}"/>
     <ellipse class="cheek" cx="106" cy="82" rx="9" ry="5.5" fill="${color}" opacity="${op}"/>`;

  return {
    neutral: {
      face: `${EYE(48, 68)}${EYE(92, 68)}
             <path d="M62 88 Q70 94 78 88" stroke="${ink}" stroke-width="3.5" fill="none" stroke-linecap="round"/>
             ${CHEEKS()}`,
      anim: 'anim-idle', bubble: '',
    },
    happy: {
      face: `<path d="M41 70 Q48 62 55 70" stroke="${ink}" stroke-width="4" fill="none" stroke-linecap="round"/>
             <path d="M85 70 Q92 62 99 70" stroke="${ink}" stroke-width="4" fill="none" stroke-linecap="round"/>
             <path d="M56 84 Q70 100 84 84 Z" fill="${ink}"/>
             <path d="M62 90 Q70 96 78 90 Z" fill="#E8886B"/>
             ${CHEEKS(blush, 1)}`,
      anim: 'anim-bounce', bubble: '히히 🎉',
    },
    angry: {
      face: `<line x1="40" y1="58" x2="56" y2="64" stroke="${ink}" stroke-width="4" stroke-linecap="round"/>
             <line x1="100" y1="58" x2="84" y2="64" stroke="${ink}" stroke-width="4" stroke-linecap="round"/>
             ${EYE(48, 72, 4.5)}${EYE(92, 72, 4.5)}
             <path d="M60 94 Q70 86 80 94" stroke="${ink}" stroke-width="3.5" fill="none" stroke-linecap="round"/>
             ${CHEEKS('#E05B5B', 0.5)}`,
      extras: `<path d="M112 30 l7 -7 M116 38 l9 -3 M108 24 l3 -9" stroke="#E05B5B" stroke-width="3" stroke-linecap="round"/>`,
      anim: 'anim-shake', bubble: '헉... 죄송해요 💦',
    },
    sad: {
      face: `<path d="M42 66 Q48 71 54 66" stroke="${ink}" stroke-width="4" fill="none" stroke-linecap="round"/>
             <path d="M86 66 Q92 71 98 66" stroke="${ink}" stroke-width="4" fill="none" stroke-linecap="round"/>
             <path d="M62 92 Q70 87 78 92" stroke="${ink}" stroke-width="3.5" fill="none" stroke-linecap="round"/>`,
      extras: `<path d="M100 74 q6 10 0 13 q-6 -3 0 -13" fill="#7EB8E8"/>`,
      anim: 'anim-droop', bubble: '힘내요 우리... 🥺',
    },
    urgent: {
      face: `<circle cx="48" cy="68" r="7.5" fill="${ink}"/><circle cx="50" cy="66" r="2.5" fill="#fff"/>
             <circle cx="92" cy="68" r="7.5" fill="${ink}"/><circle cx="94" cy="66" r="2.5" fill="#fff"/>
             <ellipse cx="70" cy="92" rx="7" ry="9" fill="${ink}"/>`,
      extras: `<text x="118" y="30" font-size="26" font-weight="bold" fill="#E05B5B">!</text>
               <path d="M24 40 q-5 9 0 12 q5 -3 0 -12" fill="#7EB8E8"/>`,
      anim: 'anim-pulse', bubble: '최선을 다할게요!! 🏃',
    },
    thinking: {
      face: `${EYE(50, 64)}${EYE(94, 64)}
             <ellipse cx="72" cy="90" rx="4.5" ry="5.5" fill="${ink}"/>`,
      extras: `<circle cx="112" cy="26" r="3" fill="#fff" opacity="0.9"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" repeatCount="indefinite"/></circle>
               <circle cx="122" cy="18" r="4" fill="#fff" opacity="0.9"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" begin="0.3s" repeatCount="indefinite"/></circle>`,
      anim: 'anim-idle', bubble: '음...',
    },
    working: {
      face: `<line x1="42" y1="68" x2="54" y2="68" stroke="${ink}" stroke-width="4" stroke-linecap="round"/>
             <line x1="86" y1="68" x2="98" y2="68" stroke="${ink}" stroke-width="4" stroke-linecap="round"/>
             <path d="M63 88 Q70 92 77 88" stroke="${ink}" stroke-width="3.5" fill="none" stroke-linecap="round"/>`,
      anim: 'anim-sway', bubble: '열일중 ⌨️',
    },
    waiting: {
      face: `<circle cx="48" cy="68" r="7" fill="${ink}"/><circle cx="50.5" cy="65.5" r="2.8" fill="#fff"/>
             <circle cx="92" cy="68" r="7" fill="${ink}"/><circle cx="94.5" cy="65.5" r="2.8" fill="#fff"/>
             <path d="M62 86 Q70 93 78 86" stroke="${ink}" stroke-width="3.5" fill="none" stroke-linecap="round"/>
             ${CHEEKS()}`,
      anim: 'anim-bounce', bubble: '확인 필요해요! 🙋',
    },
    done: {
      face: `<path d="M41 68 Q48 60 55 68" stroke="${ink}" stroke-width="4" fill="none" stroke-linecap="round"/>
             <path d="M85 68 Q92 60 99 68" stroke="${ink}" stroke-width="4" fill="none" stroke-linecap="round"/>
             <path d="M57 84 Q70 99 83 84 Z" fill="${ink}"/>
             <path d="M63 90 Q70 96 77 90 Z" fill="#E8886B"/>
             ${CHEEKS(blush, 1)}`,
      extras: `<path d="M116 22 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 Z" fill="#F2C14E"/>
               <path d="M22 14 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2 Z" fill="#F2C14E"/>`,
      anim: 'anim-tada', bubble: '다 됐어요! 🙌',
    },
    poked: {
      face: `<path d="M40 61 l12 7 -12 7" stroke="${ink}" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
             <path d="M100 61 l-12 7 12 7" stroke="${ink}" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
             <ellipse cx="70" cy="93" rx="6" ry="7.5" fill="${ink}"/>
             <ellipse cx="70" cy="95.5" rx="3.5" ry="3.5" fill="#E8886B"/>
             <ellipse class="cheek" cx="34" cy="82" rx="11" ry="6.5" fill="${blush}"/>
             <ellipse class="cheek" cx="106" cy="82" rx="11" ry="6.5" fill="${blush}"/>`,
      anim: 'anim-idle', bubble: '앗!?',
    },
    petted: {
      face: `<path d="M41 70 Q48 63 55 70" stroke="${ink}" stroke-width="4" fill="none" stroke-linecap="round"/>
             <path d="M85 70 Q92 63 99 70" stroke="${ink}" stroke-width="4" fill="none" stroke-linecap="round"/>
             <path d="M60 88 Q70 96 80 88" stroke="${ink}" stroke-width="3.5" fill="none" stroke-linecap="round"/>
             ${CHEEKS(blush, 1)}`,
      anim: 'anim-idle', bubble: '',
    },
    error: {
      face: `<path d="M40 62 Q48 58 56 62" stroke="${ink}" stroke-width="4" fill="none" stroke-linecap="round"/>
             <path d="M84 62 Q92 58 100 62" stroke="${ink}" stroke-width="4" fill="none" stroke-linecap="round"/>
             <circle cx="48" cy="72" r="5" fill="${ink}"/><circle cx="92" cy="72" r="5" fill="${ink}"/>
             <ellipse cx="70" cy="93" rx="6.5" ry="8" fill="${ink}"/>`,
      extras: `<path d="M22 40 q-5 9 0 12 q5 -3 0 -12" fill="#7EB8E8"/>
               <text x="112" y="34" font-size="24" font-weight="bold" fill="#E05B5B">!</text>`,
      anim: 'anim-shake', bubble: '앗, 뭔가 잘못됐어요 😨',
    },
    slow: {
      face: `<line x1="42" y1="70" x2="54" y2="70" stroke="${ink}" stroke-width="4" stroke-linecap="round"/>
             <line x1="86" y1="70" x2="98" y2="70" stroke="${ink}" stroke-width="4" stroke-linecap="round"/>
             <ellipse cx="70" cy="90" rx="4.5" ry="5.5" fill="${ink}"/>`,
      extras: `<path d="M108 44 q-5 10 0 13 q5 -3 0 -13" fill="#9AD4EF"/>`,
      anim: 'anim-sway', bubble: '아직 하는 중이에요...',
    },
    sleeping: {
      face: `<path d="M42 68 Q48 72 54 68" stroke="${ink}" stroke-width="4" fill="none" stroke-linecap="round"/>
             <path d="M86 68 Q92 72 98 68" stroke="${ink}" stroke-width="4" fill="none" stroke-linecap="round"/>
             <ellipse cx="70" cy="90" rx="3.5" ry="4.5" fill="${ink}"/>`,
      extras: `<text x="106" y="30" font-size="16" fill="#8a7f6e">Z</text>
               <text x="118" y="18" font-size="12" fill="#8a7f6e">z</text>`,
      anim: 'anim-sleep', bubble: '',
    },
  };
  }

  const MOOD_TTL_MS = 8000;
  const DONE_TTL_MS = 12000; // celebrate a finished task, then settle down
  const SLOW_MS = 180000;    // working this long → "still going..." reassurance
  const faceEl = document.getElementById('face');
  const extrasEl = document.getElementById('extras');
  const bodyEl = document.getElementById('body');
  const petEl = document.getElementById('pet');
  const bubbleEl = document.getElementById('bubble');

  const FALLBACK_SKIN = {
    name: 'ghost',
    bodySvg:
      '<path d="M70 24 Q66 10 76 8" stroke="#D8C7B2" stroke-width="3.5" fill="none" stroke-linecap="round"/>' +
      '<path d="M20 78 Q20 26 70 26 Q120 26 120 78 L120 118 Q110 129 100 120 Q90 131 80 121 ' +
      'Q70 132 60 121 Q50 131 40 120 Q30 129 20 118 Z" fill="#F7F0E6" stroke="#E7DAC7" stroke-width="2"/>',
    palette: DEFAULT_PALETTE,
  };

  let FACES = buildFaces(DEFAULT_PALETTE);
  let skins = [FALLBACK_SKIN];
  let skinName = localStorage.getItem('nunchi-skin') || 'ghost';
  let current = null;
  let state = { mood: 'neutral', moodAt: 0, claudeState: 'idle', claudeStateAt: 0 };
  let moodTimer = null;

  // Idle power saver: freeze looping animations after a lull so the transparent
  // overlay stops repainting. Any state change or interaction wakes it back up.
  const REST_MS = 6000;
  let restTimer = null;

  function wake() {
    document.body.classList.remove('resting');
    clearTimeout(restTimer);
    restTimer = setTimeout(() => document.body.classList.add('resting'), REST_MS);
  }

  function setFace(name) {
    if (name === current) return;
    current = name;
    const f = FACES[name] || FACES.neutral;
    faceEl.innerHTML = f.face;
    extrasEl.innerHTML = f.extras || '';
    petEl.setAttribute('class', f.anim); // SVG className is read-only — plain assignment is silently ignored
    bubbleEl.textContent = f.bubble;
    bubbleEl.classList.toggle('show', !!f.bubble);
    wake(); // a new expression is activity — animate, then settle back to rest
  }

  let interactionUntil = 0; // a poke/pet temporarily owns the face

  function resolve() {
    clearTimeout(moodTimer);
    if (Date.now() < interactionUntil) return; // let the interaction face stand
    const moodAge = Date.now() - state.moodAt;
    if (state.mood !== 'neutral' && moodAge < MOOD_TTL_MS) {
      setFace(state.mood);
      moodTimer = setTimeout(resolve, MOOD_TTL_MS - moodAge + 50);
      return;
    }
    let cs = FACES[state.claudeState] ? state.claudeState : 'neutral';
    if (cs === 'done') {
      const doneAge = Date.now() - state.claudeStateAt;
      if (doneAge >= DONE_TTL_MS) cs = 'neutral';
      else moodTimer = setTimeout(resolve, DONE_TTL_MS - doneAge + 50);
    } else if (cs === 'working') {
      // After a long stretch of tool work, switch to a reassuring "still going".
      const workAge = Date.now() - state.claudeStateAt;
      if (workAge >= SLOW_MS) cs = 'slow';
      else moodTimer = setTimeout(resolve, SLOW_MS - workAge + 50);
    }
    setFace(cs);
  }

  function applySkin(name) {
    const skin = skins.find((s) => s.name === name) || skins[0] || FALLBACK_SKIN;
    skinName = skin.name;
    localStorage.setItem('nunchi-skin', skinName);
    bodyEl.innerHTML = skin.bodySvg;
    FACES = buildFaces(skin.palette || DEFAULT_PALETTE);
    current = null; // force a re-render with the new palette
    resolve();
  }

  // In a plain browser <svg id="pet"> shadows window.pet (named element access),
  // so check for the actual preload API rather than mere existence.
  const api = window.pet && typeof window.pet.onState === 'function' ? window.pet : null;
  if (api) {
    api.onState((s) => { state = s; resolve(); });
    api.onSkins((list) => {
      if (Array.isArray(list) && list.length) skins = list;
      applySkin(skinName);
    });
    api.onSkin((name) => applySkin(name));
    document.getElementById('quit').addEventListener('click', () => api.quit());
    document.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      api.menu(skinName);
    });
  }

  // ── Size: scroll over the pet to scale it (60%–200%), persisted across runs ──
  const BASE_W = 180;
  const BASE_H = 210;
  const stageEl = document.getElementById('stage');
  let scale = Math.min(2, Math.max(0.6, parseFloat(localStorage.getItem('nunchi-scale')) || 1));
  let scaleHintTimer = null;

  function applyScale() {
    stageEl.style.zoom = scale;
    if (api && api.resize) api.resize(Math.round(BASE_W * scale), Math.round(BASE_H * scale));
  }

  // Any interaction wakes the pet from its resting (animation-paused) state.
  for (const ev of ['pointerover', 'pointerdown', 'pointermove', 'wheel']) {
    stageEl.addEventListener(ev, wake, { passive: true });
  }

  stageEl.addEventListener('wheel', (e) => {
    e.preventDefault();
    scale = Math.min(2, Math.max(0.6, scale * Math.exp(-e.deltaY * 0.0015)));
    applyScale();
    localStorage.setItem('nunchi-scale', String(scale));
    bubbleEl.textContent = Math.round(scale * 100) + '%';
    bubbleEl.classList.add('show');
    clearTimeout(scaleHintTimer);
    scaleHintTimer = setTimeout(() => {
      const f = FACES[current] || FACES.neutral;
      bubbleEl.textContent = f.bubble;
      bubbleEl.classList.toggle('show', !!f.bubble);
    }, 900);
  }, { passive: false });

  applyScale();

  // ── Touch: press to squish, release to jelly-bounce, drag to move the window ──
  const POKE_LINES = ['앗!?', '꺄악 깜짝이야', '히히 간지러워요', '왜 찔러요 ㅠㅠ', '말랑말랑하죠'];
  const wrapEl = document.getElementById('petwrap');
  const DRAG_THRESHOLD = 6; // px of screen movement before a press becomes a window drag
  let pokeTimer = null;
  let held = false, dragged = false, startX = 0, startY = 0, grabX = 0, grabY = 0;

  petEl.addEventListener('pointerdown', (e) => {
    held = true;
    dragged = false;
    startX = e.screenX; startY = e.screenY;
    grabX = e.clientX;  grabY = e.clientY;
    wrapEl.classList.remove('boing', 'graze');
    void wrapEl.offsetWidth; // restart animations if re-pressed mid-bounce
    wrapEl.classList.add('held');
    petEl.setPointerCapture(e.pointerId);
  });

  petEl.addEventListener('pointermove', (e) => {
    if (!held) return;
    if (!dragged && Math.hypot(e.screenX - startX, e.screenY - startY) > DRAG_THRESHOLD) dragged = true;
    if (dragged && api && api.move) {
      api.move(Math.round(e.screenX - grabX), Math.round(e.screenY - grabY));
    }
  });

  const release = () => {
    if (!held) return;
    held = false;
    wrapEl.classList.remove('held');
    wrapEl.classList.add('boing');
    setTimeout(() => wrapEl.classList.remove('boing'), 700);
    if (!dragged) poke();
  };
  petEl.addEventListener('pointerup', release);
  petEl.addEventListener('pointercancel', release);

  petEl.addEventListener('pointerenter', () => {
    if (held || wrapEl.classList.contains('boing')) return;
    wrapEl.classList.add('graze');
    setTimeout(() => wrapEl.classList.remove('graze'), 500);
  });

  function showFor(name, ms) {
    interactionUntil = Date.now() + ms;
    current = null; // force re-render even when repeated
    setFace(name);
    clearTimeout(pokeTimer);
    pokeTimer = setTimeout(() => { current = null; resolve(); }, ms);
  }

  function poke() {
    FACES.poked.bubble = POKE_LINES[Math.floor(Math.random() * POKE_LINES.length)];
    showFor('poked', 1400);
  }

  // ── Pet: rub the cursor back and forth over the pet (no press) → hearts ──
  const PET_LINES = ['에헤헤', '기분 좋아요', '더 해줘요', '스르륵...'];
  let lastX = null, lastDir = 0, reversals = 0, rubTimer = null, pettingUntil = 0;

  function heart(clientX, clientY) {
    const h = document.createElement('div');
    h.className = 'heart';
    h.textContent = ['💗', '💛', '💚', '🩵'][Math.floor(Math.random() * 4)];
    const r = stageEl.getBoundingClientRect();
    h.style.left = (clientX - r.left - 8 + (Math.random() * 12 - 6)) + 'px';
    h.style.top = (clientY - r.top - 14) + 'px';
    stageEl.appendChild(h);
    setTimeout(() => h.remove(), 900);
  }

  petEl.addEventListener('pointermove', (e) => {
    if (held) return; // dragging/poking owns the pointer
    if (lastX !== null) {
      const dx = e.clientX - lastX;
      if (Math.abs(dx) > 2) {
        const dir = Math.sign(dx);
        if (dir !== lastDir && lastDir !== 0) reversals += 1;
        lastDir = dir;
      }
    }
    lastX = e.clientX;
    clearTimeout(rubTimer);
    rubTimer = setTimeout(() => { reversals = 0; lastDir = 0; lastX = null; }, 400);

    if (reversals >= 2) {
      reversals = 0;
      heart(e.clientX, e.clientY);
      pettingUntil = Date.now() + 1200;
      showFor('petted', 1200);
    }
  });

  // Dev aid: number keys cycle expressions when the window is focused.
  const ORDER = Object.keys(FACES);
  document.addEventListener('keydown', (e) => {
    const i = parseInt(e.key, 10) - 1;
    if (i >= 0 && i < ORDER.length) setFace(ORDER[i]);
  });

  applySkin(skinName);
</script>
</body>
</html>
