<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>nunchi</title>
<style>
  html, body {
    margin: 0;
    background: transparent;
    overflow: hidden;
    user-select: none;
    font-family: -apple-system, "Apple SD Gothic Neo", sans-serif;
  }
  #stage {
    position: relative;
    width: 180px;
    height: 210px;
    -webkit-app-region: drag;
  }
  #bubble {
    position: absolute;
    top: 6px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255, 255, 255, 0.92);
    border-radius: 12px;
    padding: 4px 10px;
    font-size: 12px;
    color: #3d3929;
    white-space: nowrap;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
    opacity: 0;
    transition: opacity 0.25s;
  }
  #bubble.show { opacity: 1; }
  #pet {
    position: absolute;
    bottom: 10px;
    left: 50%;
    margin-left: -70px;
    width: 140px;
    height: 150px;
  }
  #quit {
    position: absolute;
    top: 0;
    right: 6px;
    width: 20px;
    height: 20px;
    line-height: 20px;
    text-align: center;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.35);
    color: #fff;
    font-size: 12px;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.2s;
    -webkit-app-region: no-drag;
  }
  #stage:hover #quit { opacity: 1; }

  .eye { transform-box: fill-box; transform-origin: center; animation: blink 4.5s infinite; }
  @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.08); } }

  #pet.anim-idle    { animation: breathe 3.2s ease-in-out infinite; }
  #pet.anim-bounce  { animation: bounce 0.55s ease-in-out infinite; }
  #pet.anim-shake   { animation: shake 0.35s linear infinite; }
  #pet.anim-droop   { animation: droop 3s ease-in-out infinite; }
  #pet.anim-pulse   { animation: pulse 0.5s ease-in-out infinite; }
  #pet.anim-sway    { animation: sway 1.6s ease-in-out infinite; }
  #pet.anim-sleep   { animation: breathe 5s ease-in-out infinite; }

  @keyframes breathe { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(0.965) translateY(2px); } }
  @keyframes bounce  { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
  @keyframes shake   { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px) rotate(-2deg); } 75% { transform: translateX(4px) rotate(2deg); } }
  @keyframes droop   { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(4px) scaleY(0.97); } }
  @keyframes pulse   { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  @keyframes sway    { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
</style>
</head>
<body>
<div id="stage">
  <div id="bubble"></div>
  <div id="quit" title="종료">×</div>
  <svg id="pet" viewBox="0 0 140 150" xmlns="http://www.w3.org/2000/svg">
    <!-- body -->
    <g id="body">
      <rect x="10" y="20" width="120" height="115" rx="42" fill="#D97757" />
      <rect x="10" y="20" width="120" height="115" rx="42" fill="#fff" opacity="0.07" />
      <!-- feet -->
      <ellipse cx="45" cy="138" rx="16" ry="9" fill="#C9664A" />
      <ellipse cx="95" cy="138" rx="16" ry="9" fill="#C9664A" />
    </g>
    <g id="face"></g>
    <g id="extras"></g>
  </svg>
</div>

<script>
  const EYE = (cx, cy, r = 5.5) =>
    `<circle class="eye" cx="${cx}" cy="${cy}" r="${r}" fill="#2d2418"/>`;
  const CHEEKS = (color = '#F2A98C', op = 0.8) =>
    `<ellipse cx="34" cy="82" rx="9" ry="5.5" fill="${color}" opacity="${op}"/>
     <ellipse cx="106" cy="82" rx="9" ry="5.5" fill="${color}" opacity="${op}"/>`;

  const FACES = {
    neutral: {
      face: `${EYE(48, 68)}${EYE(92, 68)}
             <path d="M62 88 Q70 94 78 88" stroke="#2d2418" stroke-width="3.5" fill="none" stroke-linecap="round"/>
             ${CHEEKS()}`,
      anim: 'anim-idle', bubble: '',
    },
    happy: {
      face: `<path d="M41 70 Q48 62 55 70" stroke="#2d2418" stroke-width="4" fill="none" stroke-linecap="round"/>
             <path d="M85 70 Q92 62 99 70" stroke="#2d2418" stroke-width="4" fill="none" stroke-linecap="round"/>
             <path d="M56 84 Q70 100 84 84 Z" fill="#2d2418"/>
             <path d="M62 90 Q70 96 78 90 Z" fill="#E8886B"/>
             ${CHEEKS('#F2A98C', 1)}`,
      anim: 'anim-bounce', bubble: '히히 🎉',
    },
    angry: {
      face: `<line x1="40" y1="58" x2="56" y2="64" stroke="#2d2418" stroke-width="4" stroke-linecap="round"/>
             <line x1="100" y1="58" x2="84" y2="64" stroke="#2d2418" stroke-width="4" stroke-linecap="round"/>
             ${EYE(48, 72, 4.5)}${EYE(92, 72, 4.5)}
             <path d="M60 94 Q70 86 80 94" stroke="#2d2418" stroke-width="3.5" fill="none" stroke-linecap="round"/>
             ${CHEEKS('#E05B5B', 0.5)}`,
      extras: `<path d="M112 30 l7 -7 M116 38 l9 -3 M108 24 l3 -9" stroke="#E05B5B" stroke-width="3" stroke-linecap="round"/>`,
      anim: 'anim-shake', bubble: '헉... 죄송해요 💦',
    },
    sad: {
      face: `<path d="M42 66 Q48 71 54 66" stroke="#2d2418" stroke-width="4" fill="none" stroke-linecap="round"/>
             <path d="M86 66 Q92 71 98 66" stroke="#2d2418" stroke-width="4" fill="none" stroke-linecap="round"/>
             <path d="M62 92 Q70 87 78 92" stroke="#2d2418" stroke-width="3.5" fill="none" stroke-linecap="round"/>`,
      extras: `<path d="M100 74 q6 10 0 13 q-6 -3 0 -13" fill="#7EB8E8"/>`,
      anim: 'anim-droop', bubble: '힘내요 우리... 🥺',
    },
    urgent: {
      face: `<circle cx="48" cy="68" r="7.5" fill="#2d2418"/><circle cx="50" cy="66" r="2.5" fill="#fff"/>
             <circle cx="92" cy="68" r="7.5" fill="#2d2418"/><circle cx="94" cy="66" r="2.5" fill="#fff"/>
             <ellipse cx="70" cy="92" rx="7" ry="9" fill="#2d2418"/>`,
      extras: `<text x="118" y="30" font-size="26" font-weight="bold" fill="#E05B5B">!</text>
               <path d="M24 40 q-5 9 0 12 q5 -3 0 -12" fill="#7EB8E8"/>`,
      anim: 'anim-pulse', bubble: '최선을 다할게요!! 🏃',
    },
    thinking: {
      face: `${EYE(50, 64)}${EYE(94, 64)}
             <ellipse cx="72" cy="90" rx="4.5" ry="5.5" fill="#2d2418"/>`,
      extras: `<circle cx="112" cy="26" r="3" fill="#fff" opacity="0.9"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" repeatCount="indefinite"/></circle>
               <circle cx="122" cy="18" r="4" fill="#fff" opacity="0.9"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" begin="0.3s" repeatCount="indefinite"/></circle>`,
      anim: 'anim-idle', bubble: '음...',
    },
    working: {
      face: `<line x1="42" y1="68" x2="54" y2="68" stroke="#2d2418" stroke-width="4" stroke-linecap="round"/>
             <line x1="86" y1="68" x2="98" y2="68" stroke="#2d2418" stroke-width="4" stroke-linecap="round"/>
             <path d="M63 88 Q70 92 77 88" stroke="#2d2418" stroke-width="3.5" fill="none" stroke-linecap="round"/>`,
      anim: 'anim-sway', bubble: '열일중 ⌨️',
    },
    waiting: {
      face: `<circle cx="48" cy="68" r="7" fill="#2d2418"/><circle cx="50.5" cy="65.5" r="2.8" fill="#fff"/>
             <circle cx="92" cy="68" r="7" fill="#2d2418"/><circle cx="94.5" cy="65.5" r="2.8" fill="#fff"/>
             <path d="M62 86 Q70 93 78 86" stroke="#2d2418" stroke-width="3.5" fill="none" stroke-linecap="round"/>
             ${CHEEKS()}`,
      anim: 'anim-bounce', bubble: '확인 필요해요! 🙋',
    },
    sleeping: {
      face: `<path d="M42 68 Q48 72 54 68" stroke="#2d2418" stroke-width="4" fill="none" stroke-linecap="round"/>
             <path d="M86 68 Q92 72 98 68" stroke="#2d2418" stroke-width="4" fill="none" stroke-linecap="round"/>
             <ellipse cx="70" cy="90" rx="3.5" ry="4.5" fill="#2d2418"/>`,
      extras: `<text x="106" y="30" font-size="16" fill="#8a7f6e">Z</text>
               <text x="118" y="18" font-size="12" fill="#8a7f6e">z</text>`,
      anim: 'anim-sleep', bubble: '',
    },
  };

  const MOOD_TTL_MS = 8000;
  const faceEl = document.getElementById('face');
  const extrasEl = document.getElementById('extras');
  const petEl = document.getElementById('pet');
  const bubbleEl = document.getElementById('bubble');

  let current = null;
  let state = { mood: 'neutral', moodAt: 0, claudeState: 'idle', claudeStateAt: 0 };
  let moodTimer = null;

  function setFace(name) {
    if (name === current) return;
    current = name;
    const f = FACES[name] || FACES.neutral;
    faceEl.innerHTML = f.face;
    extrasEl.innerHTML = f.extras || '';
    petEl.className = f.anim;
    bubbleEl.textContent = f.bubble;
    bubbleEl.classList.toggle('show', !!f.bubble);
  }

  function resolve() {
    clearTimeout(moodTimer);
    const moodAge = Date.now() - state.moodAt;
    if (state.mood !== 'neutral' && moodAge < MOOD_TTL_MS) {
      setFace(state.mood);
      moodTimer = setTimeout(resolve, MOOD_TTL_MS - moodAge + 50);
      return;
    }
    setFace(FACES[state.claudeState] ? state.claudeState : 'neutral');
  }

  if (window.pet) {
    window.pet.onState((s) => { state = s; resolve(); });
    document.getElementById('quit').addEventListener('click', () => window.pet.quit());
  }

  // Dev aid: number keys cycle expressions when the window is focused.
  const ORDER = Object.keys(FACES);
  document.addEventListener('keydown', (e) => {
    const i = parseInt(e.key, 10) - 1;
    if (i >= 0 && i < ORDER.length) setFace(ORDER[i]);
  });

  setFace('neutral');
</script>
</body>
</html>
